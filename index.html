<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f2f5;
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: center;
        color: #2d3748;
      }
      .container {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        padding: 14px;
        width: 100%;
        max-width: 480px;
      }
      h2 {
        margin: 0 0 12px 0;
        font-size: 1.15rem;
        text-align: center;
        color: #1a202c;
      }
      .card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .card-title {
        font-weight: bold;
        font-size: 0.85rem;
        margin-bottom: 8px;
        color: #4a5568;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      
      /* アクションボタンバー */
      .action-bar {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .action-btn {
        flex: 1;
        font-size: 0.72rem;
        padding: 6px 2px;
        border-radius: 8px;
        border: 1px solid #cbd5e0;
        background: #fff;
        color: #4a5568;
        font-weight: bold;
        cursor: pointer;
      }
      .action-btn:active { background: #edf2f7; }
      .btn-save { border-color: #bee3f8; color: #2b6cb0; }
      .btn-load { border-color: #c6f6d5; color: #276749; }
      .btn-reset { border-color: #fed7d7; color: #9b2c2c; }

      /* フォームグリッド */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
      }
      .form-group.full-width {
        grid-column: span 2;
      }
      label {
        font-size: 0.72rem;
        color: #718096;
        margin-bottom: 3px;
        font-weight: bold;
      }
      input, select {
        width: 100%;
        padding: 6px 8px;
        font-size: 0.85rem;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        background: #ffffff;
        color: #2d3748;
      }

      /* プリセットボタングループ */
      .preset-btns {
        display: flex;
        gap: 4px;
        margin-top: 4px;
      }
      .preset-btn {
        flex: 1;
        font-size: 0.65rem;
        padding: 3px 0;
        background: #edf2f7;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        cursor: pointer;
        color: #4a5568;
      }

      /* 結果カード */
      .res-box {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .res-card {
        padding: 10px;
        border-radius: 10px;
        text-align: center;
      }
      .res-card.primary { background: #fff5f5; border: 1px solid #feb2b2; color: #c53030; }
      .res-card.secondary { background: #ebf8ff; border: 1px solid #90cdf4; color: #2b6cb0; }
      .res-card.money { background: #f0fff4; border: 1px solid #9ae6b4; color: #22543d; grid-column: span 2; }
      
      .res-value {
        font-size: 1.1rem;
        font-weight: bold;
        margin: 2px 0;
      }
      .res-sub {
        font-size: 0.68rem;
        opacity: 0.85;
      }

      /* 明細テーブル */
      .detail-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.72rem;
      }
      .detail-table td {
        padding: 5px 2px;
        border-bottom: 1px dashed #e2e8f0;
      }
      .detail-table td.val {
        text-align: right;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🏃 イベラン周回シミュレーター</h2>

      <!-- アクションバー -->
      <div class="action-bar">
        <button class="action-btn btn-save" onclick="saveSettings()">💾 設定保存</button>
        <button class="action-btn btn-load" onclick="loadSettings()">📂 設定復元</button>
        <button class="action-btn btn-reset" onclick="resetSettings()">🔄 リセット</button>
      </div>

      <!-- 基本設定 -->
      <div class="card">
        <div class="card-title">📝 基本設定</div>
        <div class="form-grid">
          <div class="form-group full-width">
            <label>目標イベントポイント (pt)</label>
            <div style="display:flex; gap:6px;">
              <select id="ptPreset" style="width:40%;" onchange="applyPtPreset(this.value)">
                <option value="">(選択)</option>
                <option value="300000000">3億pt</option>
                <option value="400000000" selected>4億pt</option>
                <option value="500000000">5億pt</option>
                <option value="600000000">6億pt</option>
                <option value="700000000">7億pt</option>
                <option value="800000000">8億pt</option>
                <option value="900000000">9億pt</option>
                <option value="1000000000">10億pt</option>
              </select>
              <input type="text" id="targetPt" value="400,000,000" oninput="formatInputWithComma(this); calculate();">
            </div>
          </div>
          <div class="form-group">
            <label>現在の最大AP</label>
            <input type="text" id="maxAp" value="823" oninput="formatInputWithComma(this); calculate();">
          </div>
          <div class="form-group">
            <label>攻略パック (3,000円)</label>
            <select id="packBonus" onchange="calculate()">
              <option value="2">あり (2倍)</option>
              <option value="1">なし (1倍)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 周回データ設定（通常・ボス） -->
      <div class="card">
        <div class="card-title">⚙️ 周回・ステージ詳細設定</div>
        <div class="form-grid">
          <div class="form-group">
            <label>通常 1周消費AP</label>
            <input type="text" id="apPerRun" value="30" oninput="formatInputWithComma(this); calculate();">
          </div>
          <div class="form-group">
            <label>通常 1周所要時間(秒)</label>
            <input type="text" id="secPerNormal" value="15" oninput="formatInputWithComma(this); calculate();">
          </div>
          <div class="form-group">
            <label>通常 獲得pt (基礎)</label>
            <input type="text" id="baseNormalPt" value="15,000" oninput="formatInputWithComma(this); calculate();">
          </div>
          <div class="form-group">
            <label>通常 ドロップ券(枚)</label>
            <input type="text" id="ticketsPerRun" value="1.5" oninput="calculate();">
          </div>
          <div class="form-group">
            <label>ボス 1戦消費券(枚)</label>
            <input type="text" id="ticketsPerBoss" value="10" oninput="formatInputWithComma(this); calculate();">
          </div>
          <div class="form-group">
            <label>ボス 1戦消費AP</label>
            <input type="text" id="apPerBoss" value="0" oninput="formatInputWithComma(this); calculate();">
          </div>
          <div class="form-group">
            <label>ボス 1戦所要時間(秒)</label>
            <input type="text" id="secPerBoss" value="10" oninput="formatInputWithComma(this); calculate();">
          </div>
          <div class="form-group">
            <label>ボス 獲得pt (基礎)</label>
            <input type="text" id="baseBossPt" value="150,000" oninput="formatInputWithComma(this); calculate();">
          </div>
        </div>
      </div>

      <!-- イベントアイテム設定 -->
      <div class="card">
        <div class="card-title">⚡ イベントアイテム設定 (1個=10分)</div>
        <div class="form-grid">
          <div class="form-group">
            <label>アイテム倍率</label>
            <select id="itemMultiplier" onchange="calculate()">
              <option value="1">1倍 (使用なし)</option>
              <option value="2">2倍</option>
              <option value="3">3倍</option>
              <option value="4">4倍</option>
              <option value="5">5倍</option>
              <option value="6" selected>6倍</option>
            </select>
          </div>
          <div class="form-group">
            <label>使用個数 (個)</label>
            <input type="text" id="itemCount" value="0" oninput="formatInputWithComma(this); calculate();">
          </div>
          <div class="form-group full-width">
            <label>適用範囲シミュレーション</label>
            <select id="itemTarget" onchange="calculate()">
              <option value="all">通常ステージ ＋ ボス戦の両方に使用</option>
              <option value="boss">ボス戦のみに使用 (効率特化)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 手持ちAP回復アイテム -->
      <div class="card">
        <div class="card-title">💊 手持ちAP回復アイテム</div>
        <div class="form-grid">
          <div class="form-group">
            <label>全回復薬 (個)</label>
            <input type="text" id="fullPills" value="0" oninput="formatInputWithComma(this); calculate();">
            <div class="preset-btns">
              <button class="preset-btn" onclick="addPills('fullPills', 10)">+10</button>
              <button class="preset-btn" onclick="addPills('fullPills', 50)">+50</button>
              <button class="preset-btn" onclick="addPills('fullPills', 100)">+100</button>
            </div>
          </div>
          <div class="form-group">
            <label>AP50回復薬 (個)</label>
            <input type="text" id="halfPills" value="0" oninput="formatInputWithComma(this); calculate();">
            <div class="preset-btns">
              <button class="preset-btn" onclick="addPills('halfPills', 10)">+10</button>
              <button class="preset-btn" onclick="addPills('halfPills', 50)">+50</button>
              <button class="preset-btn" onclick="addPills('halfPills', 100)">+100</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 結果概要 -->
      <div class="res-box">
        <div class="res-card primary">
          <div class="res-sub">🚨 不足AP量</div>
          <div class="res-value" id="shortageAp">0 AP</div>
          <div class="res-sub" id="shortagePillText">全回復: あと0個</div>
        </div>
        <div class="res-card secondary">
          <div class="res-sub">⏱️ 1日あたりの周回時間</div>
          <div class="res-value" id="dailyTime">0.0 時間</div>
          <div class="res-sub" id="totalTimeText">総計: 0 時間 (7日換算)</div>
        </div>
        <div class="res-card money">
          <div class="res-sub">💰 推定課金額 (目安)</div>
          <div class="res-value" id="totalCost">0 円</div>
          <div class="res-sub" id="costBreakdown">パック: 0円 / アイテム: 0円 / AP補填: 0円</div>
        </div>
      </div>

      <!-- 詳細内訳 -->
      <div class="card">
        <div class="card-title">📊 周回リソース詳細</div>
        <table class="detail-table">
          <tr><td>通常 必要周回数</td><td class="val" id="resNormalRuns">0 回</td></tr>
          <tr><td>ボス 挑戦回数</td><td class="val" id="resBossRuns">0 回</td></tr>
          <tr><td>獲得ボス券総数</td><td class="val" id="resBossTickets">0 個</td></tr>
          <tr><td>必要総AP</td><td class="val" id="resTotalAp">0 AP</td></tr>
          <tr><td>所持AP回復量合計</td><td class="val" id="resOwnedAp">0 AP</td></tr>
          <tr><td>イベントアイテム効果時間</td><td class="val" id="resItemDuration">0 分</td></tr>
        </table>
      </div>

    </div>

    <script>
      function toCommaStr(val) {
        const num = parseInt(String(val).replace(/,/g, ''), 10);
        return isNaN(num) ? '0' : num.toLocaleString();
      }

      function getNumVal(id) {
        const val = document.getElementById(id).value;
        const num = parseInt(String(val).replace(/,/g, ''), 10);
        return isNaN(num) ? 0 : num;
      }

      function getFloatVal(id) {
        const val = document.getElementById(id).value;
        const num = parseFloat(String(val).replace(/,/g, ''));
        return isNaN(num) ? 0 : num;
      }

      function formatInputWithComma(input) {
        const cursor = input.selectionStart;
        const oldLen = input.value.length;
        input.value = toCommaStr(input.value);
        const newLen = input.value.length;
        input.setSelectionRange(cursor + (newLen - oldLen), cursor + (newLen - oldLen));
      }

      function applyPtPreset(val) {
        if (!val) return;
        document.getElementById('targetPt').value = Number(val).toLocaleString();
        calculate();
      }

      function addPills(id, addVal) {
        const cur = getNumVal(id);
        document.getElementById(id).value = (cur + addVal).toLocaleString();
        calculate();
      }

      // メイン計算処理
      function calculate() {
        const targetPt = getNumVal('targetPt');
        const maxAp = Math.max(1, getNumVal('maxAp'));
        const packBonus = parseFloat(document.getElementById('packBonus').value);
        
        // 周回パラメータ設定値の取得
        const apPerRun = Math.max(0, getNumVal('apPerRun'));
        const secPerNormal = Math.max(1, getNumVal('secPerNormal'));
        const baseNormalPt = getNumVal('baseNormalPt');
        const ticketsPerRun = Math.max(0, getFloatVal('ticketsPerRun'));
        const ticketsPerBoss = Math.max(1, getNumVal('ticketsPerBoss'));
        const apPerBoss = Math.max(0, getNumVal('apPerBoss'));
        const secPerBoss = Math.max(1, getNumVal('secPerBoss'));
        const baseBossPt = getNumVal('baseBossPt');

        // アイテム設定値
        const itemMult = parseFloat(document.getElementById('itemMultiplier').value);
        const itemCount = getNumVal('itemCount');
        const itemTarget = document.getElementById('itemTarget').value;
        const fullPills = getNumVal('fullPills');
        const halfPills = getNumVal('halfPills');

        const itemMinutes = itemCount * 10;
        const itemSec = itemMinutes * 60;

        let totalNormalRuns = 0;
        let totalBossRuns = 0;

        const bossRatio = ticketsPerBoss > 0 ? (ticketsPerRun / ticketsPerBoss) : 0;

        // 1周あたりの基礎pt（バフなし）
        const normStagePt = baseNormalPt * packBonus;
        const normBossPt = baseBossPt * packBonus;
        const unitComboPtNorm = normStagePt + (bossRatio * normBossPt);

        if (itemMult > 1 && itemCount > 0) {
          if (itemTarget === 'all') {
            // 通常＋ボス両方にバフ適用
            const buffedStagePt = baseNormalPt * packBonus * itemMult;
            const buffedBossPt = baseBossPt * packBonus * itemMult;
            const unitComboPtBuffed = buffedStagePt + (bossRatio * buffedBossPt);

            // 1セットにかかる時間（秒）
            const timePerSet = secPerNormal + (bossRatio * secPerBoss);
            
            // アイテム時間内で実行可能なセット数
            const maxBuffedSets = Math.floor(itemSec / timePerSet);
            const ptBuffed = maxBuffedSets * unitComboPtBuffed;

            if (targetPt <= ptBuffed) {
              totalNormalRuns = unitComboPtBuffed > 0 ? Math.ceil(targetPt / unitComboPtBuffed) : 0;
              totalBossRuns = Math.round(totalNormalRuns * bossRatio);
            } else {
              const remainPt = targetPt - ptBuffed;
              const addNormRuns = unitComboPtNorm > 0 ? Math.ceil(remainPt / unitComboPtNorm) : 0;
              totalNormalRuns = maxBuffedSets + addNormRuns;
              totalBossRuns = Math.round(totalNormalRuns * bossRatio);
            }

          } else if (itemTarget === 'boss') {
            // ボス戦のみにバフ適用
            const buffedBossPt = baseBossPt * packBonus * itemMult;
            const maxBuffedBossRuns = Math.floor(itemSec / secPerBoss);
            const reqBuffedNormRuns = bossRatio > 0 ? Math.ceil(maxBuffedBossRuns / bossRatio) : 0;
            
            const unitComboPtBuffed = normStagePt + (bossRatio * buffedBossPt);
            const ptBuffedSection = reqBuffedNormRuns * unitComboPtBuffed;

            if (targetPt <= ptBuffedSection) {
              totalNormalRuns = unitComboPtBuffed > 0 ? Math.ceil(targetPt / unitComboPtBuffed) : 0;
              totalBossRuns = Math.round(totalNormalRuns * bossRatio);
            } else {
              const remainPt = targetPt - ptBuffedSection;
              const addNormRuns = unitComboPtNorm > 0 ? Math.ceil(remainPt / unitComboPtNorm) : 0;
              totalNormalRuns = reqBuffedNormRuns + addNormRuns;
              totalBossRuns = Math.round(totalNormalRuns * bossRatio);
            }
          }
        } else {
          // アイテム使用なし
          totalNormalRuns = unitComboPtNorm > 0 ? Math.ceil(targetPt / unitComboPtNorm) : 0;
          totalBossRuns = Math.round(totalNormalRuns * bossRatio);
        }

        const totalTickets = Math.round(totalNormalRuns * ticketsPerRun);

        // 総消費AP = (通常周回数 × 通常AP) + (ボス挑戦回数 × ボスAP)
        const totalAp = (totalNormalRuns * apPerRun) + (totalBossRuns * apPerBoss);

        const ownedAp = (fullPills * maxAp) + (halfPills * 50);
        const shortageAp = Math.max(0, totalAp - ownedAp);
        const neededFullPills = Math.ceil(shortageAp / maxAp);

        const totalMinutes = Math.round(((totalNormalRuns * secPerNormal) + (totalBossRuns * secPerBoss)) / 60);
        const dailyHours = (totalMinutes / 60 / 7).toFixed(1);

        const packCost = (packBonus === 2) ? 3000 : 0;
        const itemCost = itemCount * 200;
        const apCost = neededFullPills * 50;

        const totalCost = packCost + itemCost + apCost;

        // 画面出力
        document.getElementById('shortageAp').textContent = shortageAp.toLocaleString() + ' AP';
        document.getElementById('shortagePillText').textContent = `全回復: あと${neededFullPills.toLocaleString()}個 (${(neededFullPills * 50).toLocaleString()}円相当)`;
        
        document.getElementById('dailyTime').textContent = dailyHours + ' 時間';
        document.getElementById('totalTimeText').textContent = `総計: ${(totalMinutes / 60).toFixed(1)} 時間 (7日換算)`;

        document.getElementById('totalCost').textContent = totalCost.toLocaleString() + ' 円';
        document.getElementById('costBreakdown').textContent = `パック:${packCost.toLocaleString()}円 / アイテム:${itemCost.toLocaleString()}円 / AP:${apCost.toLocaleString()}円`;

        document.getElementById('resNormalRuns').textContent = totalNormalRuns.toLocaleString() + ' 回';
        document.getElementById('resBossRuns').textContent = totalBossRuns.toLocaleString() + ' 回';
        document.getElementById('resBossTickets').textContent = totalTickets.toLocaleString() + ' 個';
        document.getElementById('resTotalAp').textContent = totalAp.toLocaleString() + ' AP';
        document.getElementById('resOwnedAp').textContent = ownedAp.toLocaleString() + ' AP';
        document.getElementById('resItemDuration').textContent = itemMinutes.toLocaleString() + ' 分';
      }

      // 設定の保存・復元・リセット
      function saveSettings() {
        const data = {
          targetPt: document.getElementById('targetPt').value,
          maxAp: document.getElementById('maxAp').value,
          packBonus: document.getElementById('packBonus').value,
          apPerRun: document.getElementById('apPerRun').value,
          secPerNormal: document.getElementById('secPerNormal').value,
          baseNormalPt: document.getElementById('baseNormalPt').value,
          ticketsPerRun: document.getElementById('ticketsPerRun').value,
          ticketsPerBoss: document.getElementById('ticketsPerBoss').value,
          apPerBoss: document.getElementById('apPerBoss').value,
          secPerBoss: document.getElementById('secPerBoss').value,
          baseBossPt: document.getElementById('baseBossPt').value,
          itemMultiplier: document.getElementById('itemMultiplier').value,
          itemCount: document.getElementById('itemCount').value,
          itemTarget: document.getElementById('itemTarget').value,
          fullPills: document.getElementById('fullPills').value,
          halfPills: document.getElementById('halfPills').value
        };
        localStorage.setItem('event_sim_settings_v4', JSON.stringify(data));
        alert('設定を保存しました！');
      }

      function loadSettings() {
        const raw = localStorage.getItem('event_sim_settings_v4');
        if (!raw) return alert('保存された設定がありません。');
        const data = JSON.parse(raw);

        if (data.targetPt) document.getElementById('targetPt').value = data.targetPt;
        if (data.maxAp) document.getElementById('maxAp').value = data.maxAp;
        if (data.packBonus) document.getElementById('packBonus').value = data.packBonus;
        if (data.apPerRun) document.getElementById('apPerRun').value = data.apPerRun;
        if (data.secPerNormal) document.getElementById('secPerNormal').value = data.secPerNormal;
        if (data.baseNormalPt) document.getElementById('baseNormalPt').value = data.baseNormalPt;
        if (data.ticketsPerRun) document.getElementById('ticketsPerRun').value = data.ticketsPerRun;
        if (data.ticketsPerBoss) document.getElementById('ticketsPerBoss').value = data.ticketsPerBoss;
        if (data.apPerBoss) document.getElementById('apPerBoss').value = data.apPerBoss;
        if (data.secPerBoss) document.getElementById('secPerBoss').value = data.secPerBoss;
        if (data.baseBossPt) document.getElementById('baseBossPt').value = data.baseBossPt;
        if (data.itemMultiplier) document.getElementById('itemMultiplier').value = data.itemMultiplier;
        if (data.itemCount) document.getElementById('itemCount').value = data.itemCount;
        if (data.itemTarget) document.getElementById('itemTarget').value = data.itemTarget;
        if (data.fullPills) document.getElementById('fullPills').value = data.fullPills;
        if (data.halfPills) document.getElementById('halfPills').value = data.halfPills;

        calculate();
        alert('設定を読み込みました！');
      }

      function resetSettings() {
        document.getElementById('targetPt').value = '400,000,000';
        document.getElementById('maxAp').value = '823';
        document.getElementById('packBonus').value = '2';
        document.getElementById('apPerRun').value = '30';
        document.getElementById('secPerNormal').value = '15';
        document.getElementById('baseNormalPt').value = '15,000';
        document.getElementById('ticketsPerRun').value = '1.5';
        document.getElementById('ticketsPerBoss').value = '10';
        document.getElementById('apPerBoss').value = '0';
        document.getElementById('secPerBoss').value = '10';
        document.getElementById('baseBossPt').value = '150,000';
        document.getElementById('itemMultiplier').value = '6';
        document.getElementById('itemCount').value = '0';
        document.getElementById('itemTarget').value = 'all';
        document.getElementById('fullPills').value = '0';
        document.getElementById('halfPills').value = '0';
        calculate();
      }

      window.onload = calculate;
    </script>
  </body>
</html>
